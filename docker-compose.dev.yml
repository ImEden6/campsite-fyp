services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/backend/node_modules
    command: npm run dev -w @campsite-management/backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - campsite_network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      # Vite runs inside this container: localhost is NOT the API. Proxy /api to the backend service.
      - VITE_DEV_API_PROXY_TARGET=http://backend:5000
      - VITE_DEV_WS_PROXY_TARGET=ws://backend:5000
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - /app/node_modules
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -w @campsite-management/frontend
    networks:
      - campsite_network

  studio:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
      target: development
    container_name: campsite_studio
    command: sh -c "cd backend && npx prisma studio --port 5555 --browser none"
    healthcheck:
      disable: true
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - DATABASE_URL=postgresql://campsite_user:${POSTGRES_PASSWORD:-campsite_password}@postgres:5432/campsite_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campsite_network