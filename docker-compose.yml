# Development/Demo Configuration
# Note: In production, database ports would not be exposed
# and secrets would be managed via Docker secrets or vault
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: campsite_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campsite_db
      POSTGRES_USER: campsite_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U campsite_user -d campsite_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - campsite_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: campsite_redis
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - campsite_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: campsite_backend
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
    env_file:
      - ./backend/.env
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    networks:
      - campsite_network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: campsite_frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
      - VITE_APP_NAME=Campsite Management System
      - VITE_APP_VERSION=1.0.0
    depends_on:
      - backend
    networks:
      - campsite_network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine-slim
    container_name: campsite_nginx
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/ssl:/etc/nginx/ssl
    depends_on:
      - backend
      - frontend
    networks:
      - campsite_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  campsite_network:
    driver: bridge

# Development override
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
